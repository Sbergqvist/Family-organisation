# Opsætning til Cloudflare. Bruges af wrangler-kommandoerne — sætter I projektet
# op gennem dashboardet, skal databasen bindes samme sted (se DEPLOY.md).
#
# Kør lokalt med API og database:  npx wrangler pages dev

name = "familieplan"
pages_build_output_dir = "."
compatibility_date = "2026-08-01"

# Databasen bag /api/sync. Funktionen finder den som env.DB.
# database_id fås af `npx wrangler d1 create familieplan`.
[[d1_databases]]
binding = "DB"
database_name = "familieplan"
database_id = "udfyldes-efter-oprettelse"
